<style>

:root[data-theme="dark"]{--bg:#1e1b4b;--card:#2a2566;--ink:#fef3c7;--mute:#c4b5fd;--line:#4c3fa8;--accent:#fbbf24;--accent-ink:#2a1a00;--good:#4ade80;--bad:#fb7185;--chip:#3b3490;--str:#f87171;--smt:#60a5fa;--snk:#34d399;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--chip)) fixed;color:var(--ink);font:19px/1.55 Alegreya,Georgia,serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}

p{margin:0 0 12px}
.sub{color:var(--mute);margin-bottom:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 0 var(--line)}
button{font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:12px 14px;text-align:left;width:100%;margin-bottom:10px;min-height:48px}
button:hover{filter:brightness(.96)}

button.story{color:#2b2140;border-color:rgba(0,0,0,.3);font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
button.story small{display:block;font:600 15px Nunito,sans-serif}
.stat{display:inline-block;font:700 14px Nunito,sans-serif;background:var(--chip);border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.bar{display:flex;justify-content:space-between;align-items:center;font:800 16px Nunito,sans-serif;margin-bottom:14px;gap:8px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 16px}
.scene{font-size:21px}
.art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;min-height:170px;border-radius:14px;margin-bottom:14px;padding:16px 8px 30px;font-size:52px;line-height:1}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.75),transparent 28%),radial-gradient(circle,rgba(255,255,255,.55) 1.5px,transparent 2.5px) 0 0/46px 46px}
.art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.art span{position:relative;z-index:1;filter:drop-shadow(0 6px 5px rgba(0,0,0,.4));animation:bob 3.2s ease-in-out infinite}
.art span:nth-child(2){font-size:84px;animation-delay:-1s}
.art span:nth-child(3){animation-delay:-2s}
@keyframes bob{50%{transform:translateY(-7px)}}
button.story{display:flex;align-items:center;gap:14px}
.story .big{font-size:48px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.art.svg{display:block;padding:0;min-height:0;line-height:0}.art.svg::before,.art.svg::after{display:none}.art.svg svg{width:100%;height:auto;display:block;aspect-ratio:2/1}
.w{cursor:pointer}.w i{display:none;font-style:normal}.w.o i{display:inline}
.lv button small,h2 small{display:block;font:600 14px Nunito,sans-serif;color:inherit;opacity:.8}
.lv button.main small{opacity:.95}
h1,h2{font-family:'Press Start 2P',Nunito,monospace;line-height:1.5}h1{font-size:22px}h2{font-size:13px}h2 small{font-family:Nunito,sans-serif}
.card,.bar,.art.svg,button,.av,.boost,.words span{border-radius:0}
.card{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
button{box-shadow:3px 3px 0 var(--ink)}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.art.svg{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}.art.svg svg{filter:none}
.p{animation:pb 1s steps(2) infinite}@keyframes pb{50%{transform:translateY(-4px)}}
.fl{animation:fl .5s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{50%{transform:scale(.9,1.15)}}
.sw{animation:swg 1s steps(2) infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes swg{50%{transform:rotate(9deg)}}

.gh{animation:ghf 2s steps(4) infinite}@keyframes ghf{50%{transform:translateY(-10px)}}
.wv{animation:wvs 1.6s steps(8) infinite}@keyframes wvs{to{transform:translateX(-32px)}}
.tw{animation:tw2 1.6s steps(2) infinite}@keyframes tw2{50%{opacity:.2}}
.art.svg{border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}.art.svg svg{filter:saturate(1.3) contrast(1.05)}
.p{animation:sway 3.6s ease-in-out infinite}@keyframes sway{50%{transform:translateY(-4px)}}
.mote circle{animation:tw 2.6s ease-in-out infinite}.mote circle:nth-child(even){animation-delay:-1.2s}@keyframes tw{50%{opacity:.15}}
.team{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.av{display:inline-flex;align-items:center;gap:6px;font:700 14px Nunito,sans-serif;background:var(--card);border:2px solid var(--c);border-radius:99px;padding:3px 10px 3px 4px;opacity:.65}

.av.on{opacity:1;box-shadow:0 0 0 3px var(--c);transform:scale(1.05)}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.25) rotate(8deg)}}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:46px;padding:0;text-align:center;border-radius:50%;z-index:6;font-size:22px;margin:0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-40px;font-style:normal;font-size:28px;animation:fall 3.2s linear 1 both}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--chip);border:2px solid var(--line);border-radius:8px;padding:4px 9px;font-size:16px}
.words b{font-family:Nunito,sans-serif}
.dice{font:800 58px/1 Nunito,sans-serif;text-align:center;margin:14px auto;width:140px;padding:40px 0;clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);background:linear-gradient(135deg,var(--accent),var(--smt) 60%,var(--snk));color:var(--accent-ink)}
.dice.roll{animation:wob .25s infinite}

.win{color:var(--good)}.lose{color:var(--bad)}
.res{font:800 18px Nunito,sans-serif;text-align:center;margin-bottom:10px}
.rules li{margin-bottom:6px}
.b-Strong{border-color:var(--str);background:color-mix(in srgb,var(--str) 14%,var(--card))}
.b-Smart{border-color:var(--smt);background:color-mix(in srgb,var(--smt) 14%,var(--card))}
.b-Sneaky{border-color:var(--snk);background:color-mix(in srgb,var(--snk) 14%,var(--card))}
.row{display:flex;gap:8px;margin-bottom:10px}
input[type=text],select{font:700 17px Nunito,sans-serif;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
input[type=text]{flex:1;min-width:0}
.boost{display:block;font:700 16px Nunito,sans-serif;background:var(--chip);padding:10px;border-radius:10px;margin:10px 0}
.boost input{width:20px;height:20px;vertical-align:middle;margin-right:6px}
/* ===== pixel upgrade ===== */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.055) 0 2px,transparent 2px 4px)}
.p{animation:pb 1.2s steps(2) infinite}
.hb{animation:hbb 1s steps(2) infinite}@keyframes hbb{50%{transform:translateY(-3px)}}
.bn{animation:bnc .8s steps(2) infinite}@keyframes bnc{50%{transform:translateY(-5px)}}
.fly{animation:flyx 16s steps(70) infinite}@keyframes flyx{to{transform:translateX(450px)}}
.flap{animation:flp .5s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes flp{50%{transform:scaleY(.4)}}
.sn{animation:snf 4s steps(52) infinite}@keyframes snf{to{transform:translate(-14px,212px)}}
.bz{animation:bzf 1.5s steps(52) infinite}@keyframes bzf{to{transform:translate(-120px,212px)}}
.rn{animation:rnf .7s steps(26) infinite}@keyframes rnf{to{transform:translate(-26px,212px)}}
.em{animation:emf 2s steps(10) infinite}@keyframes emf{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx,0px),-72px);opacity:0}}
.ff{animation:fff 3s steps(6) infinite alternate}@keyframes fff{0%{transform:translate(0,0);opacity:.15}50%{opacity:1}100%{transform:translate(12px,-12px);opacity:.15}}
.du{animation:duf 6s steps(12) infinite}@keyframes duf{to{transform:translate(30px,-12px);opacity:0}}
.sp{animation:spf 1.6s steps(4) infinite;transform-box:fill-box;transform-origin:center}@keyframes spf{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.lt{animation:ltf 6s steps(1) infinite}@keyframes ltf{0%,90%{opacity:0}91%{opacity:.85}92%{opacity:0}93%{opacity:.55}94%,100%{opacity:0}}
.art.svg{position:relative;overflow:hidden}
.art.svg svg{filter:saturate(1.25)}
.fin .hero{animation:jmp .7s steps(4) infinite}
@keyframes jmp{50%{transform:translateY(-26px)}}
@keyframes ow{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.art.okk .hero.on{animation:jmp .5s steps(5) 2}
.art.bad .hero.on{animation:ow .4s steps(4) 2}
.art.bad{animation:shk2 .4s steps(4) 1}@keyframes shk2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:fl2 .6s steps(6) forwards}.fw{background:#fff8c4}.fr{background:#ff2d2d}@keyframes fl2{0%{opacity:.75}100%{opacity:0}}
.bp{position:absolute;width:8px;height:8px;pointer-events:none;animation:bpf .8s steps(8) forwards}@keyframes bpf{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.pf{position:absolute;top:50%;font:11px 'Press Start 2P',monospace;pointer-events:none;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:pfy 1.2s steps(8) forwards;white-space:nowrap}.pf.g{color:#fde047}.pf.r{color:#ff6b6b}
@keyframes pfy{to{transform:translateY(-40px);opacity:0}}
.hearts{display:inline-flex;gap:3px;flex-wrap:wrap}.ht,.ic{image-rendering:pixelated;vertical-align:middle}
.ht.beat{animation:beat .8s steps(2) infinite}@keyframes beat{50%{transform:scale(1.25)}}
.bar .who,.bar .stars{display:inline-flex;align-items:center;gap:6px}
.av{border-radius:0;box-shadow:3px 3px 0 var(--c)}
.av b{width:34px;height:34px;border-radius:0;background:transparent;display:grid;place-items:center}
.av.on{box-shadow:3px 3px 0 var(--c),0 0 0 3px var(--c)}
.av.on b svg{animation:hop .6s steps(2) infinite}@keyframes hop{50%{transform:translateY(-4px)}}
.av svg{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.pv{display:grid;place-items:center;width:52px;flex:none;background:var(--chip);border:2px solid var(--ink)}
.story .big{width:64px;flex:none;display:grid;place-items:center}.story .big svg{filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35));animation:hbb 1.2s steps(2) infinite}
.dwrap{width:140px;margin:14px auto;filter:drop-shadow(4px 0 0 var(--ink)) drop-shadow(-4px 0 0 var(--ink)) drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 -4px 0 var(--ink))}
.dice{margin:0;width:140px;height:140px;padding:0;display:grid;place-items:center;font:44px 'Press Start 2P',monospace;color:#fff;text-shadow:4px 4px 0 #2b2140;clip-path:polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%);background:linear-gradient(135deg,#a78bfa 0 30%,#7c3aed 30% 65%,#5b21b6 65%)}
.dice.roll{animation:wob .3s steps(2) infinite}
.conf i{font-size:0;animation:fall 3s steps(36) 1 both}
.card,.art.svg{image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){.hb,.bn,.fly,.flap,.sn,.bz,.rn,.em,.ff,.du,.sp,.lt,.fin .hero,.ht.beat,.av.on b svg,.story .big svg,.art.bad,.art.okk .hero.on,.art.bad .hero.on{animation:none}}

sea:Sc(G("#475569","#0ea5e9"),"🌩️🌊⛵🌊",`Dark clouds come. Big waves hit your boat. A storm is here!`,"storm=very bad weather;wave=moving water on the sea;row=to move a boat with oars",[
["Row very hard.","Strong",10,`You row fast. The storm stays behind you!`,`A big wave hits you. You are wet and scared.`,1,"island"],
["Read the map and find a calm way.","Smart",9,`You find a calm way between the waves.`,`You read the map wrong. The boat goes round and round.`,1,"island"],
["Jump from rock to rock and pull the boat.","Sneaky",11,`You jump from rock to rock. Easy!`,`You slip on a wet rock. Ouch!`,1,"island"]]),
island:Sc(G("#86efac","#ca8a04"),"🏝️🦀🌴",`Skull Island is green and hot. A giant crab sleeps in front of the treasure cave.`,"giant=very, very big;crab=a sea animal with claws;claw=the sharp hand of a crab",[
["Fight the crab.","Strong",12,`You push the crab into the sea. Splash!`,`The crab’s claw hits you. It hurts!`,2,"chest"],
["Walk quietly around the crab.","Sneaky",10,`Step, step, step… the crab does not wake up.`,`You step on a stick. The crab chases you!`,1,"chest"],
["Make a rope trap with leaves.","Smart",11,`The crab walks into your trap. You are clever!`,`The trap breaks. The crab is angry!`,1,"chest"]]),
chest:Sc(G("#fbbf24","#7c2d12"),"📦🔒🗝️",`You find the treasure box! It has a lock and a riddle: “I have hands, but I cannot clap. What am I?”`,"riddle=a clever question with a hidden answer;lock=you need a key to open it;hint=a small help",[
["Answer the riddle. (Hint: it tells the time!)","Smart",8,`Click! The box opens. Gold!`,`Wrong answer! The box shakes. Try again.`,1,"end",1],
["Break the lock with a rock.","Strong",14,`CRACK! The lock breaks.`,`The rock hits your hand. Try again.`,1,"end",1],
["Open the lock with a thin stick.","Sneaky",12,`Click… the lock opens!`,`The stick breaks. Try again.`,1,"end",1]]),
end:Sc(G("#fde047","#f472b6"),"💰💎👑🎉",`Gold! Jewels! You are rich pirates. You sail home and share the treasure with everyone.`,"jewel=a beautiful, expensive stone;share=to give some to others",[])}},

{n:"Space Rescue",i:"🚀",d:"Save a lost robot on Planet Zog.",g:G("#c4b5fd","#38bdf8"),s:"ship",sc:{
ship:Sc(G("#1e1b4b","#6366f1"),"🚀🌌📡",`Your spaceship gets a message: “Help! Our robot friend is lost on Planet Zog!” You fly to Zog.`,"spaceship=a vehicle that flies in space;message=words sent to you;lost=not knowing where you are",[["Fly to Planet Zog.","",0,"","",0,"asteroid"]]),
asteroid:Sc(G("#334155","#7c3aed"),"☄️🪨🚀🪨",`Suddenly, big rocks fly towards your ship. They are very fast!`,"asteroid=a big rock in space;laser=a strong beam of light;gap=an empty space between things",[
["Fly fast through the gaps.","Sneaky",11,`You fly like a bird. No rock hits you!`,`A rock hits the ship. Bang!`,1,"planet"],
["Use the laser on the rocks.","Strong",10,`Pew! Pew! The rocks break into small pieces.`,`The laser is too weak. A rock hits you.`,1,"planet"],
["Ask the computer for the best way.","Smart",9,`The computer shows a safe way. Thank you, computer!`,`You press the wrong button. The ship shakes!`,1,"planet"]]),
planet:Sc(G("#f0abfc","#7e22ce"),"🪐👽💜",`Planet Zog is purple and strange. A friendly alien stands in the road. “Hello! Who are you?” he asks.`,"alien=a creature from another planet;strange=different and unusual;road=a way for cars or people",[
["Say hello in simple English.","Smart",8,`The alien smiles. “I know where the robot is!”`,`The alien does not understand. He looks confused.`,1,"robot"],
["Do a funny dance.","Sneaky",10,`The alien laughs and dances with you. He shows you the way.`,`You fall on the floor. The alien laughs at you.`,1,"robot"],
["Push past the alien.","Strong",12,`You move him gently. “Sorry!” you say.`,`The alien is very strong! He pushes you back.`,2,"robot"]]),
robot:Sc(G("#67e8f9","#4338ca"),"🤖🪨🔋",`You find the robot in a cave. A heavy rock is on his leg and his battery is low. “Help me, please!”`,"heavy=not light, hard to lift;battery=gives power to a machine;leg=you walk with it",[
["Lift the rock.","Strong",13,`You lift it! Hooray!`,`The rock is too heavy. Try again.`,1,"end",1],
["Use a tool to open the way.","Smart",11,`You make a lever. The rock moves!`,`The tool breaks. Try again.`,1,"end",1],
["Slide a rope under the rock.","Sneaky",11,`The rope helps you pull the rock away.`,`The rope is too short. Try again.`,1,"end",1]]),
end:Sc(G("#fde047","#38bdf8"),"🤖🚀🎉🌟",`The robot is free! “Thank you, friends!” he says. You fly home as space heroes.`,"free=not stuck;hooray=a happy shout",[])}},

{n:'The Haunted House',i:'👻',d:'Find a lost cat in a spooky house.',g:G('#c4b5fd','#4c1d95'),s:'gate',sc:{
gate:Sc(G('#4c1d95','#f59e0b'),'🏚️🌕🐈','Your friend’s cat, Milo, ran into the old house on the hill. Nobody lives there… but you hear strange sounds. You must find Milo!','haunted=full of ghosts;strange=different and unusual;sound=something you hear',[['Open the creaky gate.','',0,'','',0,'hall']]),
hall:Sc(G('#1e1b4b','#6d28d9'),'🕯️👻🕸️','The hall is dark and cold. A ghost floats in front of you and says: “Whooo goes there?”','ghost=the spirit of a dead person;float=to stay in the air;cold=not warm',[
['Say: “Hello! Where is Milo?”','Smart',8,`The ghost is surprised. “Nobody says hello! Milo is upstairs.”`,`The ghost does not understand. He laughs very loudly.`,1,'stairs'],
['Run past the ghost.','Sneaky',11,`You run under the ghost. He does not catch you!`,`The ghost touches you. Brrr, it is so cold!`,1,'stairs'],
['Shout “BOO!” very loudly.','Strong',10,`The ghost is scared and flies away!`,`The ghost laughs. “That is not scary!”`,1,'stairs']]),
stairs:Sc(G('#334155','#a855f7'),'🪜🔦🦇','The old stairs are broken. Some steps are missing. You hear Milo above you: “Miaow!”','stairs=steps that go up;missing=not there;torch=a small light you carry',[
['Jump over the missing steps.','Strong',11,`You jump! You land on a good step.`,`A step breaks. You fall down a little.`,1,'attic'],
['Walk on the sides of the steps.','Sneaky',10,`You walk like a cat. Not a sound!`,`The wood makes a loud CRACK. You slip.`,1,'attic'],
['Use a torch to find a safe way.','Smart',9,`The torch shows you the strong steps.`,`The torch goes out. You go up in the dark.`,1,'attic']]),
attic:Sc(G('#292524','#c026d3'),'📦🕷️🐈‍⬛','In the attic, Milo is inside a big old box. A giant spider sits on the heavy lid.','attic=a room under the roof;lid=the top of a box;spider=a small animal with eight legs',[
['Push the lid and open the box.','Strong',13,`The lid opens! Milo jumps out.`,`The lid is too heavy. Try again.`,1,'end',1],
['Sing a quiet song to the spider.','Smart',10,`The spider loves music! It goes to sleep.`,`The spider does not like your voice. Try again.`,1,'end',1],
['Take Milo very quietly.','Sneaky',12,`You take Milo without a sound.`,`The spider moves! You jump back. Try again.`,1,'end',1]]),
end:Sc(G('#fde68a','#a78bfa'),'🐈🏠🎉☀️','You carry Milo out of the house. He is safe! Your friend is so happy.','safe=not in danger;happy=feeling good',[])}},

{n:'Jungle Rescue',i:'🦜',d:'Find a baby elephant in the jungle.',g:G('#86efac','#15803d'),s:'camp',sc:{
camp:Sc(G('#bbf7d0','#16a34a'),'⛺🐘🌴','A mother elephant is crying near your camp. Her baby is lost in the jungle! “Please find him!”','jungle=a hot forest with many plants;baby=a very young animal;crying=making tears',[['Follow the footprints into the jungle.','',0,'','',0,'river']]),
river:Sc(G('#67e8f9','#047857'),'🌊🐊🌿','A wide river is in front of you. A crocodile watches from the water.','crocodile=a big animal with sharp teeth;wide=big from side to side;vine=a long plant like a rope',[
['Swing across on a vine.','Strong',10,`Wheee! You swing over the river.`,`The vine breaks. Splash!`,1,'tree'],
['Build a small raft with wood.','Smart',10,`Your raft is strong. You cross easily.`,`The raft is too small. You get wet.`,1,'tree'],
['Walk on the rocks quietly.','Sneaky',11,`Hop, hop, hop. The crocodile does not move.`,`You slip! The crocodile opens its mouth.`,1,'tree']]),
tree:Sc(G('#fde047','#166534'),'🌳🐍🦜','Next, you see a big snake in a tree. The elephant’s footprints go past it.','snake=a long animal with no legs;branch=an arm of a tree;footprint=a mark made by a foot',[
['Throw a stone to the other side.','Smart',9,`The snake looks at the noise. You walk past.`,`The snake sees you. It is angry!`,1,'mud'],
['Hit the branch with a stick.','Strong',11,`The snake falls and goes away.`,`The stick breaks. The snake is angry!`,1,'mud'],
['Run fast and stay low.','Sneaky',11,`You are past the snake in a second!`,`The snake follows you for a long time.`,1,'mud']]),
mud:Sc(G('#a16207','#365314'),'🐘🟤😢','The baby elephant is stuck in deep mud! He is afraid and makes a loud noise.','mud=wet, soft earth;stuck=not able to move;loud=with a lot of sound',[
['Pull him with a strong rope.','Strong',13,`You pull and pull… Pop! He is out.`,`The mud is too deep. Try again.`,1,'end',1],
['Talk softly and show him fruit.','Smart',9,`He calms down and walks out by himself.`,`He is too afraid. Try again.`,1,'end',1],
['Put branches under his feet.','Sneaky',11,`The branches make a bridge. He walks out!`,`The branches sink. Try again.`,1,'end',1]]),
end:Sc(G('#fde047','#4ade80'),'🐘💚🌴🎉','You take the baby elephant back to his mother. She is so happy!','mother=a female parent;thank=to say “thanks”',[])}},

{n:'The School Mystery',i:'🔍',d:'Who took the teacher’s birthday cake?',g:G('#fcd34d','#f472b6'),s:'room',sc:{
room:Sc(G('#fef9c3','#fb923c'),'🏫🎂😢','Today is Mrs. Green’s birthday. But her cake is gone! The class is sad. You are the detective.','detective=a person who finds answers to mysteries;mystery=something nobody can explain;cake=a sweet food for parties',[['Start looking for clues.','',0,'','',0,'corridor']]),
corridor:Sc(G('#bae6fd','#6366f1'),'👣🍫🚪','In the corridor you see small chocolate footprints. They go to the library.','corridor=a long hall in a building;clue=something that helps you find the answer;chocolate=a sweet brown food',[
['Follow the footprints quietly.','Sneaky',10,`You follow them without a sound.`,`You step in chocolate and slip!`,1,'library'],
['Look at the size of the footprints.','Smart',9,`They are small, with four toes… it is an animal!`,`You cannot tell. They are all the same.`,1,'library'],
['Push open the heavy library door.','Strong',10,`The door opens with a BANG.`,`The door is stuck. You hurt your shoulder.`,1,'library']]),
library:Sc(G('#a78bfa','#f59e0b'),'📚🤫📖','The library is quiet. Behind a shelf, you hear a strange noise: “Munch, munch, munch…”','library=a place with many books;shelf=a flat board for books;munch=to eat noisily',[
['Move the heavy shelf.','Strong',12,`You move the shelf. There is someone behind it!`,`The shelf is too heavy. Books fall on you!`,2,'culprit'],
['Look in the books for a clue.','Smart',10,`A book says: “Dogs love chocolate cake!”`,`You read the wrong book. It is about fish.`,1,'culprit'],
['Creep around the shelf.','Sneaky',11,`You look around the corner. Surprise!`,`You make a noise. The munching stops.`,1,'culprit']]),
culprit:Sc(G('#fde68a','#ef4444'),'🐶🍰😋','It is Max, the school dog! He has chocolate on his face and a big smile. Mrs. Green is at the door.','culprit=the one who did something bad;sorry=a word you say when you did wrong;smile=a happy face',[
['Say kindly: “Max, give us the cake!”','Smart',8,`Max understands. He gives you the cake.`,`Max runs away. Try again.`,1,'end',1],
['Catch Max with a fast jump.','Strong',12,`You catch Max! He gives you the cake.`,`Max is too fast. Try again.`,1,'end',1],
['Show Max a biscuit and take the cake.','Sneaky',11,`Max loves biscuits! You take the cake.`,`Max is not stupid. Try again.`,1,'end',1]]),
end:Sc(G('#fde047','#f472b6'),'🎂🐶🎉🎈','Max says sorry with his big eyes. Mrs. Green laughs. “Best birthday ever!” she says.','laugh=to make a happy sound;best=the number one',[])}},

{n:'The Frozen Mountain',i:'🏔️',d:'Take medicine to a sick child in the snow.',g:G('#e0f2fe','#38bdf8'),s:'town',sc:{
town:Sc(G('#e0f2fe','#1d4ed8'),'🏘️❄️💊','A child is sick in the snow village. The doctor gives you medicine. “Go up the mountain. Be fast!”','medicine=something you take when you are ill;sick=not healthy;snow=white frozen rain',[['Go up the mountain.','',0,'','',0,'storm']]),
storm:Sc(G('#94a3b8','#e2e8f0'),'🌨️💨🧭','The wind is very strong and the snow is thick. You cannot see the path!','blizzard=a storm with wind and snow;path=a small way for walking;compass=a tool that shows north',[
['Push through the wind.','Strong',11,`You walk and walk. You are strong!`,`The wind pushes you down. You are cold.`,1,'bridge'],
['Use your compass to find the path.','Smart',9,`The compass shows the way. Good idea!`,`The compass is frozen. You guess the way.`,1,'bridge'],
['Follow animal tracks.','Sneaky',10,`The tracks lead to a safe path.`,`The tracks go round and round.`,1,'bridge']]),
bridge:Sc(G('#a5f3fc','#1e3a8a'),'🧊🌉😬','An old ice bridge crosses a deep hole. It makes cracking sounds!','ice=frozen water;crack=a line where something breaks;deep=far down',[
['Cross slowly, step by step.','Sneaky',10,`Step… step… You are across!`,`The ice cracks! You run the last meters.`,1,'wolf'],
['Hit the ice to make safe steps.','Strong',12,`Your axe makes strong steps in the ice.`,`The ice breaks under you. Brrr!`,2,'wolf'],
['Put wood boards on the ice.','Smart',10,`The boards make the ice safe. Clever!`,`The boards are too short.`,1,'wolf']]),
wolf:Sc(G('#cbd5e1','#7c3aed'),'🐺🛖🌙','A white wolf stands in front of the little house of the sick child. The wolf looks hungry.','wolf=a wild animal like a big dog;hungry=wanting to eat;hut=a very small house',[
['Scare the wolf with fire.','Strong',13,`The wolf sees the fire and runs away.`,`The fire goes out. Try again.`,1,'end',1],
['Give the wolf your food.','Smart',8,`The wolf eats and walks away. It is not angry now.`,`The wolf wants more food. Try again.`,1,'end',1],
['Walk slowly around the wolf.','Sneaky',12,`The wolf watches you but does not move.`,`The wolf growls. You step back. Try again.`,1,'end',1]]),
end:Sc(G('#fde68a','#7dd3fc'),'👧☀️⛄🎉','The child takes the medicine. In the morning she is better and plays in the snow. You are a mountain hero!','better=less sick;hero=a brave person who helps',[])}}
